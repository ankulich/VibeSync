# Provider Service — local development config.
# Provider credentials come from env, NOT this file:
#   VB_OAUTH_SPOTIFY_CLIENT_ID / VB_OAUTH_SPOTIFY_CLIENT_SECRET — Spotify app
#     credentials (client-credentials grant for search + anonymous resolve).
# YouTube is keyless (public oEmbed + IFrame player, see ADR-0016): no
# credentials needed, search is replaced by add-by-URL on the client.
# DB / Redis passwords come from VB_DB_PASSWORD / VB_REDIS_PASSWORD.
db:
  host: localhost
  port: 5432
  user: vibesync
  database: provider
  sslmode: disable
  max_conns: 5

redis:
  addr: localhost:6379
  db: 0

web:
  addr: :8086
  cors_allow_origins:
    - http://localhost:5173
  rate_limit_per_second: 10

spotify:
  enabled: false

youtube:
  enabled: true

# Auth Service origin (host:port) for per-user provider tokens.
auth_service_addr: localhost:8080

log:
  level: debug
  format: console

otel:
  endpoint: localhost:4317
  sample_ratio: 1.0

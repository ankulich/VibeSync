# Auth Service — local development config.
# Secrets (DB password, OAuth client secrets, key master) come from env, NOT
# this file. The keys below document which env vars to set. See ADR-0007.

db:
  host: localhost
  port: 5432
  user: vibesync
  # Read from VB_DB_PASSWORD env.
  database: auth
  sslmode: disable
  max_conns: 5

redis:
  addr: localhost:6379
  # Read from VB_REDIS_PASSWORD env (empty in local).
  db: 0

kafka:
  brokers:
    - localhost:9094
  topic: vibesync

auth:
  access_ttl: 15m
  refresh_ttl: 720h        # 30d
  session_ttl: 720h
  oauth_flow_ttl: 10m
  key_rotation_interval: 168h   # 7d
  key_master_env: VB_AUTH_KEY_MASTER   # 32-byte AES-256 key, base64
  issuer: https://auth.vibesync.local

oauth:
  redirect_uri_base: http://localhost:8080
  spotify:
    client_id_env: VB_OAUTH_SPOTIFY_CLIENT_ID
    client_secret_env: VB_OAUTH_SPOTIFY_CLIENT_SECRET
    scopes: [user-read-email, user-read-private]
    enabled: false
  google:
    client_id_env: VB_OAUTH_GOOGLE_CLIENT_ID
    client_secret_env: VB_OAUTH_GOOGLE_CLIENT_SECRET
    scopes: [openid, email, profile]
    enabled: false

web:
  addr: :8080
  cors_allow_origins:
    - http://localhost:5173   # Vite dev server
  rate_limit_per_second: 10

log:
  level: debug
  format: console

otel:
  endpoint: localhost:4317
  sample_ratio: 1.0

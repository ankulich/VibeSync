# Playback Service — local development config.
db:
  host: localhost
  port: 5432
  user: vibesync
  database: playback
  sslmode: disable
  max_conns: 5

redis:
  addr: localhost:6379
  db: 0

kafka:
  brokers:
    - localhost:9094
  topic: sync.updated.v1
  consumer_group_id: playback-service

web:
  addr: :8084
  cors_allow_origins:
    - http://localhost:5173
  rate_limit_per_second: 10

log:
  level: debug
  format: console

otel:
  endpoint: localhost:4317
  sample_ratio: 1.0

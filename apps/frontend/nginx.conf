# VibeSync frontend: serve the built SPA + proxy Connect-RPC calls to the
# backend services on the vibesync Docker network (container names).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown path (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Connect-RPC proxying (same routing as the Vite dev proxy) ---------

    location /vibesync.auth {
        proxy_pass http://auth-service:8080;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.user {
        proxy_pass http://user-service:8081;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.room {
        proxy_pass http://room-service:8082;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.sync {
        proxy_pass http://sync-service:8083;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.playback {
        proxy_pass http://playback-service:8084;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.media {
        proxy_pass http://media-service:8085;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.provider {
        proxy_pass http://provider-service:8086;
        include /etc/nginx/proxy-params.conf;
    }

    # Gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}

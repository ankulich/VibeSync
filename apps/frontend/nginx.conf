# VibeSync frontend: serve the built SPA + proxy Connect-RPC calls to the
# backend services on the vibesync Docker network (service names).
#
# Upstreams are referenced through VARIABLES with an explicit Docker DNS
# resolver. nginx otherwise resolves proxy_pass hostnames ONCE at config
# load and caches the IP forever — recreating a backend container (e.g.
# `make svc-up S=user-service`) hands it a new IP and every proxy_pass to
# it starts returning 502 until the frontend is restarted. With a variable,
# the name is re-resolved per request (honoring `valid=10s`), so updating a
# single backend never breaks the proxy.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown path (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Connect-RPC proxying (same routing as the Vite dev proxy) ---------

    location /vibesync.auth {
        set $auth_upstream http://auth-service:8080;
        proxy_pass $auth_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.user {
        set $user_upstream http://user-service:8081;
        proxy_pass $user_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.room {
        set $room_upstream http://room-service:8082;
        proxy_pass $room_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.sync {
        set $sync_upstream http://sync-service:8083;
        proxy_pass $sync_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.playback {
        set $playback_upstream http://playback-service:8084;
        proxy_pass $playback_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.media {
        set $media_upstream http://media-service:8085;
        proxy_pass $media_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location /vibesync.provider {
        set $provider_upstream http://provider-service:8086;
        proxy_pass $provider_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    # Gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}

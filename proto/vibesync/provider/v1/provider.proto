syntax = "proto3";

package vibesync.provider.v1;

import "vibesync/common/v1/common.proto";

// Provider Service contracts. Full shapes land in Phase 10 (Providers).
// Providers wrap external music/video backends (Spotify, YouTube) behind a
// single gRPC surface.

enum ProviderName {
  PROVIDER_NAME_UNSPECIFIED = 0;
  PROVIDER_NAME_SPOTIFY = 1;
  PROVIDER_NAME_YOUTUBE = 2;
}

message SearchRequest {
  ProviderName provider = 1;
  string query = 2;
  vibesync.common.v1.PageRequest page = 3;
}

message SearchResult {
  string external_ref = 1;
  string title = 2;
  string artist = 3;
  string cover_url = 4;
  uint64 duration_ms = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
  vibesync.common.v1.PageResponse page = 2;
}

message ResolveRequest {
  ProviderName provider = 1;
  string external_ref = 2;
}

message ResolveResponse {
  string title = 1;
  string artist = 2;
  string cover_url = 3;
  uint64 duration_ms = 4;
  // Stream/playback URL the Media Service will fetch from. May be short-lived.
  string playable_url = 5;
}

service ProviderService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}
